[package]
name = "rust-wifi-repeater"
version = "1.0.0"
authors = ["Marumasa"]
edition = "2021"
resolver = "2"

[dependencies]
anyhow = "1"
log = "0.4"
esp-idf-sys = { version = "0.36", features = ["binstart"] }
esp-idf-svc = { version = "0.50", features = ["alloc"] }
embedded-svc = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
heapless = "0.8"

[build-dependencies]
embuild = "0.33"
